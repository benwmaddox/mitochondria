[package]
name = "btree-rust"
version = "0.0.1"
edition = "2021"

[workspace]

[dependencies]

# The strongest ordinary release settings, so Mitochondria is compared with Rust at its best: the standard library's
# BTreeMap and allocator, whole-program optimization, one codegen unit, no unwinding.
[profile.release]
debug = false
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
